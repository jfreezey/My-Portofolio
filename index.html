<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      background-color: white;
      display: flex;
      justify-content: center;
    }

    .kotak-abu {
      width: 748px;
      height: 748px;
      background-color:black;
      display: grid;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 1fr;
    }


    .red {
      background-color: #E72F24;
    }

    .putih-row1 {
      background-color: #F0F1EC;
      grid-column: span 3;
    }

    .putih-row2 {
      background-color: #F0F1EC;
      grid-row: span 2;
    }

    .putih2-row2 {
      background-color: #F0F1EC;
      grid-column:span 2;
      grid-row: span 2;
    }
    
    .putih-row3{
      background-color: #F0F1EC;
      grid-row:span 2;
    }

    .putih-row4{
      background-color: #F0F1EC;
    }

    .blue {
      background-color: #004592;
      border-bottom: 10px solid black;

    }
    .yellow {
      background-color: #F9D01E;

    }
    .black {
      background-color: #232629;
    }


  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="kotak-abu">
      <div class="red"></div>
      <div class="putih-row1"></div>
      <div class="putih-row2"></div>
      <div class="putih2-row2"></div>
      <div class="blue"></div>
      <div class="putih-row3"></div>
      <div class="putih-row4"></div>
      <div class="yellow"></div>
      <div class="black"></div>
    
    
  </div>
  

</body>

</html>
